repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        name: ruff
        entry: ruff
        language: python
        args: [check, --fix, --preview, --exit-non-zero-on-fix, --force-exclude, "--config=./pyproject.toml"]
        types: [python]
