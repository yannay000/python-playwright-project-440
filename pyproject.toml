[project]
name = "hexlet-code"
version = "0.1.0"
description = "Test Playwrightproject for kanban board"
authors = [
	{name = "Коваль Виктор", email = "yan1992@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "pytest-dotenv>=0.5.2",
    "playwright>=1.63.0",
    "pytest-playwright>=0.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
env_files = [
    ".env",
]
markers = [
    "flaky: flaky tests",
]

[tool.ruff]

line-length = 120

[tool.ruff.lint.per-file-ignores]
# init modules can contain the local imports, logic, unused imports
"__init__.py" = ["F401"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "C90"]
